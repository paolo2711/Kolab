# compila kolab y lo sube a la app web kolab-g4 de azure cada vez que algo entra a develop

name: Desplegar en Azure (kolab-g4)

on:
  push:
    branches:
      - 'develop'
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      # corre las pruebas tambien: si alguna falla no se despliega
      - name: Compilar con Maven
        run: mvn clean package

      - name: Guardar el jar
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/target/*.jar'

  desplegar:
    runs-on: ubuntu-latest
    needs: compilar

    steps:
      - name: Bajar el jar
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Subir a la App Web
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'kolab-g4'
          slot-name: 'Production'
          package: '*.jar'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_624D3AD60CA84093BC35D4738EC65129 }}