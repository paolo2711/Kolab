name: Pruebas

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # el wrapper viene del repositorio sin permiso de ejecucion, que en Windows no hace falta
      - name: Permitir ejecutar el wrapper
        run: chmod +x mvnw

      - name: Correr las pruebas
        run: ./mvnw -B test
