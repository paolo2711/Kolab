spring.application.name=kolab

# la conexion no se escribe aqui: viene del entorno, asi ninguna contrasena entra al repositorio
spring.datasource.url=${KOLAB_DB_URL}
spring.datasource.username=${KOLAB_DB_USER}
spring.datasource.password=${KOLAB_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# las migraciones crean y cambian tablas, asi que corren con el rol dueno del esquema. la
# aplicacion se conecta con uno que solo lee y escribe filas. si no se definen, se usa el mismo
# usuario de la conexion.
# lo de db/migration corre en cualquier motor; lo de {vendor} solo donde aplica. los permisos de
# PostgreSQL no tienen equivalente en H2, asi que viven aparte y las pruebas no los ven
spring.flyway.locations=classpath:db/migration/comun,classpath:db/migration/{vendor}
spring.flyway.fail-on-missing-locations=false
spring.flyway.user=${KOLAB_MIGRACION_USER:${KOLAB_DB_USER}}
spring.flyway.password=${KOLAB_MIGRACION_PASSWORD:${KOLAB_DB_PASSWORD}}

spring.thymeleaf.cache=false

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

logging.level.com.kolab=DEBUG
