# Perfil para mostrar la aplicacion sin instalar nada: la base vive en memoria y se crea sola en
# cada arranque, con las mismas migraciones que usa PostgreSQL. Se pierde todo al cerrar.
spring.datasource.url=jdbc:h2:mem:kolab;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.user=sa
spring.flyway.password=

logging.level.com.kolab=INFO
logging.level.org.flywaydb=WARN
