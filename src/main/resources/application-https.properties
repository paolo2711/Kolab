# Perfil para probar la aplicacion por https en la propia maquina.
# Se levanta con:  .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=https"
# El certificado lo crea scripts\crear-certificado-local.ps1 y no se sube al repositorio:
# es uno firmado por si mismo, asi que el navegador avisa que no lo conoce y eso es lo esperado.

server.port=8443
server.ssl.enabled=true
server.ssl.key-store=${KOLAB_KEYSTORE}
server.ssl.key-store-password=${KOLAB_KEYSTORE_CLAVE}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=kolab
