# las pruebas corren contra H2 en memoria: no hace falta un PostgreSQL levantado para compilar.
# el esquema lo crean las mismas migraciones de Flyway que usa la aplicacion, asi que si una
# migracion y una entidad dejan de coincidir, las pruebas se caen.
spring.datasource.url=jdbc:h2:mem:kolab;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration/comun,classpath:db/migration/{vendor}
spring.flyway.fail-on-missing-locations=false

logging.level.com.kolab=INFO
